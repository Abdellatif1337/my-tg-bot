services:
  - type: worker
    name: disciplineos-worker
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: disciplineos-db
          property: connectionString
      - key: ADMIN_TELEGRAM_ID
        sync: false
databases:
  - name: disciplineos-db
    plan: starter
